<svg xmlns="http://www.w3.org/2000/svg"
    width="495" height="164"
    viewBox="0 0 495 164"
    role="img"
    aria-label="fastapi-degree-planner: Backend API for degree planning, built with FastAPI and SQLAlchemy, featuring authentication, course management, prerequisite validation, semester planning, and progress tracking.">

  <rect x="0.75" y="0.75"
        width="493.5" height="162.5"
        rx="12"
        fill="#0D1116"
        stroke="#3D444D"
        stroke-width="1"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif">
    <!-- repo icon (Octicons "repo", 16px grid) -->
    <g transform="translate(24 20) scale(1.125)" fill="none"
       stroke="#9198A1" stroke-width="1.2" stroke-linejoin="round">
      <path d="M2.5 13V3.5A1.5 1.5 0 0 1 4 2h8.5v10.5H4A1.5 1.5 0 0 0 2.5 14z"/>
      <path d="M4 12.5h8.5V15H4"/>
    </g>

    <text x="52" y="35" font-size="15" font-weight="700"
          fill="#F0F6FC">fastapi-degree-planner</text>

    <circle cx="423.8" cy="30.5" r="4.5" fill="#3572A5"/>
    <text x="433.8" y="35" font-size="11"
          fill="#9198A1">Python</text>

    <text x="24" y="66" font-size="12" fill="#9198A1">Backend API for degree planning, built with FastAPI and SQLAlchemy,</text>
    <text x="24" y="84" font-size="12" fill="#9198A1">featuring authentication, course management, prerequisite</text>
    <text x="24" y="102" font-size="12" fill="#9198A1">validation, semester planning, and progress tracking.</text>

    <rect x="24" y="118" width="60" height="22" rx="11" fill="#241b3a" stroke="#3f2f69" stroke-width="1"/>
    <text x="54.0" y="133" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b794f6">FastAPI</text>
    <rect x="92" y="118" width="78" height="22" rx="11" fill="#241b3a" stroke="#3f2f69" stroke-width="1"/>
    <text x="131.0" y="133" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b794f6">SQLAlchemy</text>
    <rect x="178" y="118" width="78" height="22" rx="11" fill="#241b3a" stroke="#3f2f69" stroke-width="1"/>
    <text x="217.0" y="133" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b794f6">PostgreSQL</text>
    <rect x="264" y="118" width="54" height="22" rx="11" fill="#241b3a" stroke="#3f2f69" stroke-width="1"/>
    <text x="291.0" y="133" font-size="10.5" font-weight="600" text-anchor="middle" fill="#b794f6">pytest</text>
  </g>
</svg>
